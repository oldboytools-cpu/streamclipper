name: Build VFAB AI Android APK

on:
  push:
    branches:
      - deploy/vfab-cloud-first
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android debug APK
        working-directory: mobile/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if gradle --no-daemon --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency fetch failed; waiting before retry."
              sleep $((attempt * 25))
            fi
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFAB-AI-Android-debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
